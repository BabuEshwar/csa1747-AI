<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input[type="text"], input[type="number"], input[type="button"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="button"] {
            background-color: #5cb85c;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background-color: #4cae4c;
        }
        #result {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Payroll System</h1>
<form id="payrollForm">
    <label for="employeeName">Employee Name:</label>
    <input type="text" id="employeeName" placeholder="Enter employee name" required>

    <label for="position">Position:</label>
    <input type="text" id="position" placeholder="Enter position" required>

    <label for="salary">Salary per Hour:</label>
    <input type="number" id="salary" placeholder="Enter salary" required>

    <label for="hoursWorked">Hours Worked:</label>
    <input type="number" id="hoursWorked" placeholder="Enter hours worked" required>

    <input type="button" value="Calculate Pay" onclick="calculatePay()">
</form>

<div id="result"></div>

<script>
    function calculatePay() {
        const name = document.getElementById('employeeName').value;
        const position = document.getElementById('position').value;
        const salary = parseFloat(document.getElementById('salary').value);
        const hoursWorked = parseFloat(document.getElementById('hoursWorked').value);

        const totalPay = salary * hoursWorked;

        document.getElementById('result').innerHTML = `
            <h3>Payroll Summary</h3>
            <p>Employee Name: ${name}</p>
            <p>Position: ${position}</p>
            <p>Salary per Hour: $${salary.toFixed(2)}</p>
            <p>Hours Worked: ${hoursWorked}</p>
            <p><strong>Total Pay: $${totalPay.toFixed(2)}</strong></p>
        `;
    }
</script>

</body>
</html>
